<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CyberLab Academy — Siber Güvenlik Eğitimi</title>
        <meta
            name="description"
            content="Sıfırdan uzmanlığa siber güvenlik eğitim arşivi — Linux, ağ, açık tarama, savunma ve AI güvenliği."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #050505;
                --bg2: #0f1115;
                --bg3: #1a1d24;
                --bg4: #242832;
                --border: #222630;
                --border-hover: #333945;
                --green: #00e676;
                --green-dim: rgba(0, 230, 118, 0.1);
                --green-glow: rgba(0, 230, 118, 0.4);
                --blue: #2979ff;
                --yellow: #ffea00;
                --red: #ff1744;
                --purple: #d500f9;
                --cyan: #00e5ff;
                --orange: #ff9100;
                --text: #f0f2f5;
                --text-muted: #9ba1a6;
                --radius: 12px;
                --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
                --shadow-hover: 0 12px 40px rgba(0, 230, 118, 0.15);
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family:
                    "Inter",
                    -apple-system,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            h1,
            h2,
            h3,
            h4,
            h5 {
                font-family: "Outfit", "Inter", sans-serif;
                letter-spacing: -0.02em;
            }

            /* ─── SCROLLBARS ─── */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: var(--bg4);
                border-radius: 10px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: var(--muted);
            }

            /* ─── TOPBAR ─── */
            .topbar {
                display: flex;
                align-items: center;
                gap: 20px;
                padding: 0 28px;
                height: 64px;
                background: rgba(15, 17, 21, 0.7);
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                z-index: 100;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            }
            .topbar-logo {
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 19px;
                font-weight: 800;
                color: var(--green);
                text-decoration: none;
                font-family: "Outfit", sans-serif;
                text-shadow: 0 0 15px var(--green-dim);
            }
            .topbar-logo span {
                color: var(--text);
                font-weight: 500;
            }
            .topbar-back {
                padding: 8px 18px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text-muted);
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }
            .topbar-back:hover {
                background: var(--bg3);
                color: var(--text);
                border-color: var(--border-hover);
                transform: translateY(-1px);
            }
            .topbar-stats {
                margin-left: auto;
                display: flex;
                gap: 24px;
                font-size: 13.5px;
                color: var(--text-muted);
                font-weight: 500;
            }
            .topbar-stats span {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .topbar-stats b {
                color: var(--text);
                font-weight: 700;
            }
            .topbar-stats span:nth-child(2) b {
                color: var(--yellow);
                text-shadow: 0 0 10px rgba(255, 234, 0, 0.3);
            } /* XP */
            .topbar-stats span:nth-child(3) b {
                color: var(--green);
                text-shadow: 0 0 10px var(--green-dim);
            } /* Pct */
            .rank-founder {
                color: #ff1744 !important;
                text-shadow:
                    0 0 8px #ff1744,
                    0 0 20px rgba(255, 23, 68, 0.7);
                font-weight: 800;
                letter-spacing: 0.5px;
            }
            .rank-admin {
                color: #c77dff !important;
                text-shadow: 0 0 7px rgba(174, 63, 255, 0.75);
            }
            .rank-instructor {
                color: #ffd166 !important;
                text-shadow: 0 0 7px rgba(255, 172, 32, 0.7);
            }
            .rank-student {
                color: #55ceff !important;
                text-shadow: 0 0 7px rgba(35, 170, 255, 0.65);
            }
            .academy-founder-tick {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                margin-left: 8px;
                background: linear-gradient(135deg, #2a0008, #110003);
                border: 2px solid #ff1744;
                border-radius: 50%;
                color: #ff1744;
                font-size: 14px;
                font-weight: 900;
                vertical-align: middle;
                box-shadow:
                    0 0 15px rgba(255, 23, 68, 0.6),
                    inset 0 0 10px rgba(255, 23, 68, 0.4);
                animation: founder-neon-pulse 2s infinite alternate;
                text-shadow: 0 0 8px #ff1744;
            }
            .academy-founder-tick::after {
                content: "";
                position: absolute;
                inset: -5px;
                border: 2px dashed rgba(255, 23, 68, 0.6);
                border-radius: 50%;
                animation: founder-spin 8s linear infinite;
            }
            @keyframes founder-spin {
                100% {
                    transform: rotate(360deg);
                }
            }
            @keyframes founder-neon-pulse {
                0% {
                    box-shadow:
                        0 0 10px rgba(255, 23, 68, 0.5),
                        inset 0 0 6px rgba(255, 23, 68, 0.3);
                    transform: scale(1);
                }
                100% {
                    box-shadow:
                        0 0 20px rgba(255, 23, 68, 0.9),
                        inset 0 0 12px rgba(255, 23, 68, 0.6);
                    transform: scale(1.05);
                }
            }

            /* ─── LAYOUT ─── */
            body {
                overflow-x: hidden;
            }
            .page {
                display: flex;
                flex: 1;
                align-items: flex-start;
            }
            .sidebar {
                width: 300px;
                min-width: 300px;
                background: var(--bg2);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                height: calc(100vh - 64px);
                position: sticky;
                top: 64px;
                overflow-y: auto;
                transition: transform 0.3s ease;
                z-index: 50;
            }
            .main {
                flex: 1;
                padding: 40px 50px 80px;
                min-width: 0;
                position: relative;
                background:
                    radial-gradient(
                        circle at top right,
                        rgba(0, 230, 118, 0.03),
                        transparent 40%
                    ),
                    var(--bg);
            }

            /* ─── SIDEBAR ─── */
            .sidebar-search {
                padding: 20px;
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                background: var(--bg2);
                z-index: 10;
            }
            .sidebar-search input {
                width: 100%;
                padding: 11px 16px 11px 38px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text);
                font-size: 13.5px;
                outline: none;
                transition: all 0.25s;
                box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            }
            .sidebar-search input:focus {
                border-color: var(--green);
                box-shadow:
                    inset 0 2px 4px rgba(0, 0, 0, 0.2),
                    0 0 0 3px var(--green-dim);
            }
            .sidebar-search::before {
                content: "⌕";
                position: absolute;
                left: 34px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
                font-size: 16px;
            }

            .sidebar-module {
                border-bottom: 1px solid var(--border);
            }
            .sidebar-module-header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 16px 20px;
                cursor: pointer;
                transition: background 0.2s;
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                user-select: none;
            }
            .sidebar-module-header:hover {
                background: rgba(255, 255, 255, 0.02);
            }
            .sidebar-module.open .sidebar-module-header {
                background: rgba(255, 255, 255, 0.03);
                border-bottom: 1px solid var(--border);
            }
            .sidebar-module-header .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                flex-shrink: 0;
                box-shadow: 0 0 8px currentColor;
            }
            .sidebar-module-header .count {
                margin-left: auto;
                font-size: 11.5px;
                color: var(--text-muted);
                background: var(--bg3);
                padding: 3px 8px;
                border-radius: 12px;
                font-weight: 500;
            }
            .sidebar-lessons {
                display: none;
                padding: 8px 0;
                background: var(--bg);
            }
            .sidebar-module.open .sidebar-lessons {
                display: block;
                animation: slideDown 0.3s ease;
            }

            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .sidebar-lesson {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 20px 10px 42px;
                cursor: pointer;
                font-size: 13px;
                color: var(--text-muted);
                transition: all 0.2s;
                border: none;
                background: none;
                width: 100%;
                text-align: left;
                font-weight: 500;
                position: relative;
            }
            .sidebar-lesson::before {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 3px;
                background: var(--green);
                transform: scaleY(0);
                transition: transform 0.2s;
            }
            .sidebar-lesson:hover {
                color: var(--text);
                background: rgba(255, 255, 255, 0.02);
            }
            .sidebar-lesson.active {
                background: linear-gradient(
                    90deg,
                    var(--green-dim),
                    transparent
                );
                color: var(--text);
            }
            .sidebar-lesson.active::before {
                transform: scaleY(1);
            }
            .sidebar-lesson.completed {
                color: var(--text-muted);
            }
            .sidebar-lesson.locked {
                color: #55606d;
                cursor: not-allowed;
                opacity: 0.62;
            }
            .sidebar-lesson.locked:hover {
                color: #55606d;
                background: transparent;
            }
            .sidebar-lesson .check {
                width: 18px;
                height: 18px;
                border-radius: 50%;
                border: 1.5px solid var(--border-hover);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
                flex-shrink: 0;
                transition: all 0.2s;
            }
            .sidebar-lesson.completed .check {
                background: var(--green);
                border-color: var(--green);
                color: #000;
                box-shadow: 0 0 10px var(--green-dim);
            }
            .sidebar-lesson.active .check:not(.completed) {
                border-color: var(--green);
                color: var(--green);
            }
            .sidebar-lesson .meta {
                margin-left: auto;
                font-size: 11px;
                white-space: nowrap;
                opacity: 0.7;
            }

            /* ─── HERO ─── */
            .hero {
                background: linear-gradient(
                    135deg,
                    rgba(15, 17, 21, 0.8),
                    rgba(26, 29, 36, 0.6)
                );
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 48px;
                margin-bottom: 40px;
                position: relative;
                overflow: hidden;
                box-shadow: var(--shadow);
                backdrop-filter: blur(10px);
            }
            .hero::before {
                content: "";
                position: absolute;
                top: -50%;
                right: -10%;
                width: 600px;
                height: 600px;
                background: radial-gradient(
                    circle,
                    var(--green-dim) 0%,
                    transparent 60%
                );
                pointer-events: none;
                opacity: 0.5;
            }
            .hero::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    var(--green),
                    transparent
                );
                opacity: 0.3;
            }
            .hero-eyebrow {
                font-size: 12px;
                letter-spacing: 3px;
                color: var(--green);
                text-transform: uppercase;
                font-weight: 700;
                margin-bottom: 16px;
                text-shadow: 0 0 10px var(--green-dim);
            }
            .hero h1 {
                font-size: 36px;
                font-weight: 800;
                margin-bottom: 12px;
                color: #fff;
            }
            .hero p {
                color: var(--text-muted);
                font-size: 16px;
                max-width: 650px;
                line-height: 1.7;
                font-weight: 400;
            }

            .hero-progress {
                margin-top: 32px;
                display: flex;
                align-items: center;
                gap: 20px;
                background: rgba(0, 0, 0, 0.3);
                padding: 16px 24px;
                border-radius: 12px;
                border: 1px solid var(--border);
                width: max-content;
                max-width: 100%;
            }
            .hero-progress-bar {
                width: 250px;
                height: 8px;
                background: var(--bg);
                border-radius: 4px;
                overflow: hidden;
                box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
            }
            .hero-progress-bar i {
                display: block;
                height: 100%;
                border-radius: 4px;
                background: linear-gradient(90deg, var(--green), var(--cyan));
                box-shadow: 0 0 10px var(--green-dim);
                transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .hero-progress-text {
                font-size: 14px;
                color: var(--text-muted);
                font-weight: 500;
            }
            .hero-progress-text b {
                color: #fff;
            }

            /* ─── COURSE CARDS (Home view) ─── */
            .courses-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
                gap: 24px;
                animation: fadeIn 0.4s ease;
            }
            .track-filter {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 0 0 18px;
            }
            .track-filter button {
                border: 1px solid var(--border);
                border-radius: 6px;
                background: rgba(255, 255, 255, 0.04);
                color: var(--text-muted);
                padding: 8px 10px;
                font-size: 12px;
                cursor: pointer;
            }
            .track-filter button.active {
                border-color: var(--green);
                color: var(--green);
                background: rgba(0, 232, 137, 0.08);
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .course-card {
                background: #151515;
                border: 1px solid #2a2a2a;
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            .course-card:hover {
                border-color: #444;
                transform: translateY(-4px);
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            }

            .course-thumbnail {
                height: 180px;
                position: relative;
                margin: 12px 12px 0 12px;
                border-radius: 8px;
                background-size: cover;
                background-position: center;
            }
            .course-thumbnail::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.6) 0%,
                    transparent 50%
                );
                border-radius: 8px;
            }
            .lesson-visual-panel {
                display: grid;
                grid-template-columns: minmax(220px, 0.95fr) minmax(260px, 1.05fr);
                gap: 18px;
                margin: 0 0 28px;
                padding: 16px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: linear-gradient(135deg, rgba(255,255,255,0.045), rgba(0,0,0,0.18));
            }
            .lesson-visual-panel img {
                width: 100%;
                min-height: 220px;
                object-fit: cover;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.08);
            }
            .visual-map {
                display: grid;
                gap: 10px;
                align-content: center;
            }
            .visual-map h3 {
                margin: 0;
                font-size: 18px;
            }
            .visual-map p {
                margin: 0;
                color: var(--text-muted);
                line-height: 1.6;
            }
            .visual-flow {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 8px;
                margin-top: 6px;
            }
            .visual-flow span {
                padding: 10px;
                border-radius: 6px;
                background: rgba(0,0,0,0.24);
                border: 1px solid rgba(255,255,255,0.08);
                color: var(--text);
                font-size: 12px;
                line-height: 1.35;
            }
            .visual-focus {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }
            .visual-focus div {
                padding: 10px;
                border-radius: 6px;
                background: rgba(0,232,137,0.055);
                border: 1px solid rgba(0,232,137,0.14);
                color: var(--text);
                font-size: 12px;
                line-height: 1.45;
            }
            .course-badge {
                position: absolute;
                top: 12px;
                left: 12px;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(4px);
                color: #fff;
                font-size: 11px;
                font-weight: 600;
                padding: 4px 8px;
                border-radius: 4px;
                z-index: 1;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .course-content {
                padding: 20px;
                display: flex;
                flex-direction: column;
                flex: 1;
            }

            .course-rating {
                font-size: 11px;
                color: #00e889;
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                gap: 6px;
                letter-spacing: 2px;
            }
            .course-rating span {
                color: var(--text-muted);
                letter-spacing: normal;
            }

            .course-card h3 {
                font-size: 18px;
                margin-bottom: 12px;
                color: #fff;
                line-height: 1.4;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .course-author {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 16px;
            }
            .course-author .author-avatar {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #333;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
            }
            .course-author span {
                font-size: 13px;
                color: #fff;
                font-weight: 500;
            }

            .course-card p {
                font-size: 13px;
                color: var(--text-muted);
                line-height: 1.6;
                margin-bottom: 24px;
                flex: 1;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .course-meta {
                display: flex;
                align-items: center;
                gap: 16px;
                margin-bottom: 20px;
            }
            .meta-item {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                color: var(--text-muted);
            }
            .meta-item svg {
                width: 14px;
                height: 14px;
                opacity: 0.7;
            }

            .course-btn {
                width: 100%;
                background: #00e889;
                color: #000;
                border: none;
                border-radius: 6px;
                padding: 12px;
                font-weight: 700;
                font-size: 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                transition: background 0.2s;
                cursor: pointer;
            }
            .course-btn:hover {
                background: #00c776;
            }
            .course-card.locked {
                opacity: 0.52;
                cursor: not-allowed;
                filter: saturate(0.45);
            }
            .course-card.locked:hover {
                transform: none;
                border-color: var(--border);
                box-shadow: none;
            }

            /* ─── COURSE DETAIL ─── */
            .course-detail {
                max-width: 1080px;
                margin: 0 auto;
            }
            .course-detail-back {
                margin-bottom: 20px;
            }
            .course-detail-hero {
                display: grid;
                grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
                overflow: hidden;
                border: 1px solid var(--border);
                border-radius: 16px;
                background: var(--bg2);
                box-shadow: var(--shadow);
            }
            .course-detail-cover {
                position: relative;
                min-height: 360px;
                overflow: hidden;
                background: var(--bg3);
            }
            .course-detail-cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .course-detail-cover::after {
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.2);
                pointer-events: none;
            }
            .course-detail-cover-fallback {
                height: 100%;
                min-height: 360px;
                display: grid;
                place-items: center;
                color: var(--course-color);
                font-size: 84px;
                background: #10151a;
            }
            .course-detail-copy {
                display: flex;
                flex-direction: column;
                padding: 34px;
            }
            .course-detail-kicker {
                margin-bottom: 12px;
                color: var(--course-color);
                font: 700 11px "JetBrains Mono", monospace;
                text-transform: uppercase;
            }
            .course-detail-copy h1 {
                color: #fff;
                font-size: clamp(26px, 4vw, 38px);
                line-height: 1.15;
            }
            .course-detail-description {
                margin: 16px 0 22px;
                color: var(--text-muted);
                font-size: 15px;
                line-height: 1.7;
            }
            .course-detail-author {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 22px;
                color: #fff;
                font-size: 13px;
                font-weight: 600;
            }
            .course-detail-author span:first-child {
                display: grid;
                place-items: center;
                width: 30px;
                height: 30px;
                border: 1px solid var(--border-hover);
                border-radius: 50%;
                background: var(--bg3);
            }
            .course-detail-facts {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 24px;
            }
            .course-detail-fact {
                padding: 13px;
                border: 1px solid var(--border);
                border-radius: 9px;
                background: var(--bg);
            }
            .course-detail-fact small {
                display: block;
                margin-bottom: 5px;
                color: var(--text-muted);
                font-size: 10px;
            }
            .course-detail-fact strong {
                color: #fff;
                font: 700 14px "JetBrains Mono", monospace;
            }
            .course-detail-cta {
                margin-top: auto;
            }
            .course-detail-cta .course-btn {
                justify-content: center;
                gap: 10px;
            }
            .course-detail-cta .course-btn:disabled {
                cursor: not-allowed;
                background: var(--bg4);
                color: var(--text-muted);
            }
            .course-detail-progress {
                margin-top: 12px;
                color: var(--text-muted);
                text-align: center;
                font-size: 11px;
            }
            .course-detail-grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 300px;
                gap: 22px;
                margin-top: 22px;
            }
            .course-detail-panel {
                padding: 26px;
                border: 1px solid var(--border);
                border-radius: 14px;
                background: var(--bg2);
            }
            .course-detail-panel + .course-detail-panel {
                margin-top: 18px;
            }
            .course-detail-panel h2 {
                margin-bottom: 18px;
                color: #fff;
                font-size: 19px;
            }
            .course-outcome-list {
                display: grid;
                gap: 12px;
                list-style: none;
            }
            .course-outcome-list li {
                position: relative;
                padding-left: 28px;
                color: #c8d0d7;
                font-size: 13px;
                line-height: 1.55;
            }
            .course-outcome-list li::before {
                content: "✓";
                position: absolute;
                left: 0;
                top: 0;
                color: var(--course-color);
                font-weight: 800;
            }
            .course-curriculum {
                display: grid;
                gap: 8px;
            }
            .course-curriculum-item {
                display: grid;
                grid-template-columns: 34px minmax(0, 1fr) auto;
                gap: 12px;
                align-items: center;
                padding: 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--bg);
            }
            .course-curriculum-item > span:first-child {
                display: grid;
                place-items: center;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: var(--bg3);
                color: var(--course-color);
                font: 700 10px "JetBrains Mono", monospace;
            }
            .course-curriculum-item strong {
                display: block;
                color: #e9edf0;
                font-size: 12px;
            }
            .course-curriculum-item small {
                display: block;
                margin-top: 3px;
                color: var(--text-muted);
                font-size: 10px;
            }
            .course-curriculum-item > span:last-child {
                color: var(--text-muted);
                font: 10px "JetBrains Mono", monospace;
            }
            .certificate-preview {
                position: sticky;
                top: 84px;
                text-align: center;
            }
            .certificate-mark {
                display: grid;
                place-items: center;
                width: 72px;
                height: 72px;
                margin: 0 auto 16px;
                border: 1px solid #9b7b2d;
                border-radius: 50%;
                background: #1b1810;
                color: #f2c85b;
                font-size: 32px;
            }
            .certificate-preview p {
                margin-bottom: 18px;
                color: var(--text-muted);
                font-size: 12px;
                line-height: 1.6;
            }
            .certificate-name {
                padding: 13px;
                border: 1px solid #4b4022;
                border-radius: 8px;
                background: #15130e;
                color: #f2d884;
                font-size: 12px;
                font-weight: 700;
            }
            .certificate-note {
                display: block;
                margin-top: 12px;
                color: #7f8790;
                font-size: 10px;
                line-height: 1.5;
            }

            @media (max-width: 980px) {
                .course-detail-hero,
                .course-detail-grid {
                    grid-template-columns: 1fr;
                }
                .course-detail-cover {
                    min-height: 300px;
                }
                .certificate-preview {
                    position: static;
                }
            }

            @media (max-width: 600px) {
                .course-detail-copy,
                .course-detail-panel {
                    padding: 20px;
                }
                .course-detail-cover,
                .course-detail-cover-fallback {
                    min-height: 220px;
                }
                .course-detail-facts {
                    grid-template-columns: 1fr 1fr;
                }
                .course-curriculum-item {
                    grid-template-columns: 30px minmax(0, 1fr);
                }
                .course-curriculum-item > span:last-child {
                    display: none;
                }
            }

            @media (max-width: 520px) {
                #academy-profile-link {
                    display: none;
                }
            }

            /* ─── DRIVE LINK (BOXED UI) ─── */
            .drive-link {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 12px 16px;
                margin-top: 12px;
                background: rgba(0, 232, 137, 0.08);
                border: 1px solid var(--green-dim);
                border-radius: 8px;
                color: var(--green);
                font-weight: 600;
                font-size: 13px;
                text-decoration: none;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .drive-link:hover {
                background: rgba(0, 232, 137, 0.15);
                border-color: var(--green);
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(0, 232, 137, 0.2);
            }

            /* ─── LESSON READER ─── */
            .reader {
                max-width: 840px;
                margin: 0 auto;
                animation: fadeIn 0.4s ease;
            }
            .reader-nav {
                display: flex;
                gap: 12px;
                margin-bottom: 32px;
            }
            .btn-sm {
                padding: 8px 16px;
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text-muted);
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                transition: all 0.2s;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }
            .btn-sm:hover {
                background: var(--bg3);
                color: var(--text);
                border-color: var(--border-hover);
            }

            .reader-header {
                border-bottom: 1px solid var(--border);
                padding-bottom: 32px;
                margin-bottom: 36px;
            }
            .reader-header .breadcrumb {
                font-size: 13px;
                color: var(--text-muted);
                margin-bottom: 16px;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .reader-header h2 {
                font-size: 32px;
                font-weight: 800;
                margin-bottom: 16px;
                color: #fff;
                line-height: 1.2;
            }
            .reader-header p {
                color: var(--text-muted);
                font-size: 16px;
                line-height: 1.6;
            }
            .reader-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                margin-top: 24px;
            }
            .reader-meta span {
                font-size: 13px;
                padding: 6px 14px;
                border-radius: 6px;
                background: var(--bg2);
                border: 1px solid var(--border);
                color: var(--text-muted);
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .reader-meta span b {
                color: var(--text);
            }
            .reader-meta span.xp {
                border-color: rgba(255, 234, 0, 0.2);
                background: rgba(255, 234, 0, 0.05);
                color: var(--yellow);
            }

            /* ─── Kod Bloğu Kopyala Butonu ─── */
            .code-block-wrapper {
                position: relative;
                margin: 1rem 0;
            }
            .code-block-wrapper pre,
            .reader-section pre {
                background: #0d1117;
                border: 1px solid #30363d;
                border-radius: 8px;
                padding: 1rem 1rem 1rem 1.25rem;
                overflow-x: auto;
                font-family: 'JetBrains Mono', monospace;
                font-size: 13px;
                line-height: 1.65;
                color: #e6edf3;
                margin: 0;
            }
            .copy-code-btn {
                position: absolute;
                top: 8px;
                right: 8px;
                background: rgba(48,54,61,0.9);
                border: 1px solid #444c56;
                color: #8b949e;
                border-radius: 6px;
                padding: 4px 10px;
                font-size: 11px;
                font-family: 'JetBrains Mono', monospace;
                cursor: pointer;
                transition: all 0.2s;
                backdrop-filter: blur(4px);
                z-index: 2;
            }
            .copy-code-btn:hover {
                background: rgba(0,230,118,0.15);
                border-color: var(--green);
                color: var(--green);
            }
            .copy-code-btn.copied {
                background: rgba(0,230,118,0.2);
                border-color: var(--green);
                color: var(--green);
            }

            /* ─── Sidebar Filtre Butonları ─── */
            .sidebar-filters {
                display: flex;
                gap: 6px;
                padding: 10px 12px 0;
                flex-wrap: wrap;
            }
            .sidebar-filter-btn {
                font-size: 11px;
                font-family: 'JetBrains Mono', monospace;
                padding: 4px 10px;
                border-radius: 20px;
                border: 1px solid #2a3040;
                background: transparent;
                color: #6b7a90;
                cursor: pointer;
                transition: all 0.2s;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
            .sidebar-filter-btn:hover,
            .sidebar-filter-btn.active {
                background: rgba(0,230,118,0.12);
                border-color: var(--green);
                color: var(--green);
            }

            /* ─── Ders Bilgi Kartı ─── */
            .lesson-info-card {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                margin-bottom: 28px;
                padding: 0;
            }
            .lesson-info-card .lic-item {
                background: rgba(255,255,255,0.03);
                border: 1px solid rgba(255,255,255,0.07);
                border-radius: 10px;
                padding: 14px 16px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .lesson-info-card .lic-label {
                font-size: 10px;
                color: #6b7a90;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-weight: 700;
                font-family: 'JetBrains Mono', monospace;
            }
            .lesson-info-card .lic-value {
                font-size: 17px;
                font-weight: 700;
                color: #fff;
            }
            .lesson-info-card .lic-value.green { color: var(--green); }
            .lesson-info-card .lic-value.yellow { color: var(--yellow); }
            .lesson-info-card .lic-value.cyan { color: var(--cyan); }

            .reader-section {
                margin-bottom: 40px;
            }
            .reader-section h3 {
                font-size: 20px;
                font-weight: 700;
                margin-bottom: 16px;
                color: #fff;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .reader-section h3::before {
                content: "";
                display: block;
                width: 4px;
                height: 20px;
                background: var(--green);
                border-radius: 2px;
                box-shadow: 0 0 10px var(--green-dim);
            }
            .reader-section p,
            .reader-section ul,
            .reader-section ol {
                font-size: 15.5px;
                line-height: 1.8;
                color: #d1d5db;
                margin-bottom: 16px;
            }
            .deep-teaching {
                margin-top: 18px;
                padding: 16px;
                border: 1px solid rgba(0, 232, 137, 0.16);
                border-radius: 8px;
                background: rgba(0, 232, 137, 0.045);
            }
            .deep-teaching.adversary-teaching {
                border-color: rgba(255, 77, 90, 0.28);
                background:
                    linear-gradient(135deg, rgba(255, 77, 90, 0.08), rgba(0, 229, 255, 0.045)),
                    rgba(5, 8, 12, 0.92);
                box-shadow: inset 3px 0 0 rgba(255, 77, 90, 0.72);
            }
            .deep-teaching.adversary-teaching h4 {
                color: #ff6b7a;
            }
            .deep-teaching h4 {
                margin: 0 0 10px;
                color: var(--green);
                font-size: 15px;
            }
            .deep-teaching p,
            .deep-teaching li {
                color: var(--text);
            }
            .deep-teaching code {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--green);
                background: rgba(0, 0, 0, 0.22);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 4px;
                padding: 2px 5px;
            }
            .teaching-rubric {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
                margin: 12px 0;
            }
            .teaching-rubric span {
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                padding: 10px;
                background: rgba(0, 0, 0, 0.18);
                color: var(--text-muted);
                font-size: 12px;
                line-height: 1.5;
            }
            .term-line {
                margin-bottom: 0 !important;
            }

            .outcomes-list {
                list-style: none;
                padding: 0;
                display: grid;
                gap: 12px;
            }
            .outcomes-list li {
                padding: 16px 20px 16px 44px;
                position: relative;
                font-size: 15px;
                color: #d1d5db;
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 8px;
            }
            .outcomes-list li::before {
                content: "✓";
                position: absolute;
                left: 16px;
                top: 16px;
                color: var(--green);
                font-weight: 800;
                font-size: 14px;
                background: var(--green-dim);
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
            }

            .command-block {
                background: #000;
                border: 1px solid #333;
                border-radius: 10px;
                margin-bottom: 24px;
                overflow: hidden;
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.8);
            }
            .command-header {
                display: flex;
                align-items: center;
                padding: 12px 16px;
                background: #111;
                border-bottom: 1px solid #222;
                font-size: 12px;
                color: #888;
            }
            .command-header::before {
                content: "";
                display: inline-block;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #ff5f56;
                box-shadow:
                    20px 0 0 #ffbd2e,
                    40px 0 0 #27c93f;
                margin-right: 60px;
            }
            .command-header code {
                font-family: "JetBrains Mono", monospace;
                font-size: 14px;
                color: var(--green);
                margin-left: 10px;
                flex: 1;
                text-shadow: 0 0 5px rgba(0, 255, 136, 0.3);
            }
            .command-header button {
                padding: 6px 12px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid #333;
                border-radius: 6px;
                color: #aaa;
                cursor: pointer;
                font-size: 12px;
                transition: all 0.2s;
                font-weight: 500;
            }
            .command-header button:hover {
                color: #fff;
                background: rgba(255, 255, 255, 0.1);
            }
            .command-desc {
                padding: 16px 20px;
                font-size: 14px;
                color: #a1a1aa;
                line-height: 1.6;
                border-top: 1px dashed #222;
                background: #0a0a0a;
            }

            .exercise-box {
                background: linear-gradient(
                    135deg,
                    rgba(41, 121, 255, 0.05),
                    rgba(41, 121, 255, 0.01)
                );
                border: 1px solid rgba(41, 121, 255, 0.2);
                border-radius: 12px;
                padding: 24px 28px;
                margin: 32px 0;
                position: relative;
                overflow: hidden;
            }
            .exercise-box::before {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 4px;
                background: var(--blue);
            }
            .exercise-box h3 {
                color: var(--blue);
                margin-bottom: 12px;
                font-size: 18px;
                border: none;
                padding: 0;
            }
            .exercise-box h3::before {
                display: none;
            }
            .exercise-box p {
                font-size: 15px;
                color: #c2d6ff;
                line-height: 1.7;
                margin: 0;
            }

            .safety-box {
                background: rgba(255, 23, 68, 0.05);
                border: 1px solid rgba(255, 23, 68, 0.2);
                border-radius: 12px;
                padding: 20px 24px;
                margin: 32px 0;
                display: flex;
                gap: 16px;
                align-items: flex-start;
            }
            .safety-box::before {
                content: "⚠";
                font-size: 24px;
                color: var(--red);
                line-height: 1;
            }
            .safety-box div {
                flex: 1;
            }
            .safety-box strong {
                color: var(--red);
                font-size: 16px;
                display: block;
                margin-bottom: 4px;
            }
            .safety-box p {
                font-size: 14.5px;
                color: #ffb3b3;
                margin: 0;
                line-height: 1.6;
            }

            .reader-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-top: 32px;
                margin-top: 48px;
                border-top: 1px solid var(--border);
            }
            .btn-complete {
                padding: 12px 24px;
                background: var(--green-dim);
                border: 1px solid rgba(0, 230, 118, 0.3);
                border-radius: 8px;
                color: var(--green);
                cursor: pointer;
                font-size: 14.5px;
                font-weight: 700;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            }
            .btn-complete:hover {
                background: var(--green);
                color: #000;
                box-shadow: 0 8px 25px var(--green-glow);
                transform: translateY(-2px);
            }
            .btn-complete.done {
                background: var(--bg3);
                color: var(--green);
                border-color: var(--border);
                box-shadow: none;
                transform: none;
                cursor: default;
            }
            .lesson-page-nav {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
                margin: 18px 0 26px;
            }
            .lesson-page-tab {
                padding: 10px 8px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--bg2);
                color: var(--muted);
                font: 700 10px "JetBrains Mono";
                cursor: pointer;
            }
            .lesson-page-tab:hover {
                border-color: var(--blue);
                color: var(--text);
            }
            .lesson-page-tab.active {
                border-color: var(--green);
                color: var(--green);
                background: rgba(0, 230, 118, 0.07);
                box-shadow: 0 0 16px rgba(0, 230, 118, 0.08);
            }
            .lesson-page-progress {
                height: 4px;
                margin: -12px 0 30px;
                border-radius: 4px;
                background: #171c22;
                overflow: hidden;
            }
            .lesson-page-progress i {
                display: block;
                height: 100%;
                background: linear-gradient(90deg, var(--blue), var(--green));
                transition: width 0.25s;
            }
            .page-kicker {
                margin-bottom: 10px;
                color: var(--blue);
                font: 700 10px "JetBrains Mono";
                letter-spacing: 0.14em;
            }
            .study-callout {
                padding: 18px 20px;
                margin: 20px 0;
                border: 1px solid rgba(84, 210, 255, 0.2);
                border-radius: 10px;
                background: rgba(84, 210, 255, 0.045);
            }
            .study-callout h4 {
                margin: 0 0 8px;
                color: var(--blue);
            }
            .study-callout p {
                margin: 0;
                color: #cbd5e1;
                line-height: 1.7;
            }
            .learning-tool {
                margin: 24px 0 36px;
                padding: 20px;
                border: 1px solid rgba(0, 232, 137, 0.24);
                border-radius: 10px;
                background: rgba(0, 232, 137, 0.045);
            }
            .learning-tool h3 { margin: 0 0 8px; font-size: 17px; }
            .learning-tool > p { margin: 0 0 14px; color: var(--text-muted); line-height: 1.6; }
            .learning-checklist { display: grid; gap: 10px; }
            .learning-checklist label {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                padding: 10px 12px;
                border: 1px solid var(--border);
                border-radius: 7px;
                background: var(--bg2);
                color: #d1d5db;
                line-height: 1.45;
                cursor: pointer;
            }
            .learning-checklist input { margin-top: 3px; accent-color: var(--green); }
            .learning-note {
                width: 100%;
                min-height: 130px;
                resize: vertical;
                border: 1px solid var(--border2);
                border-radius: 8px;
                padding: 12px;
                background: rgba(0, 0, 0, 0.28);
                color: var(--text);
                font: inherit;
                line-height: 1.6;
            }
            .learning-note:focus { outline: none; border-color: var(--green); }
            .learning-save-hint { display: block; margin-top: 8px; color: var(--text-muted); font-size: 12px; }
            .page-footer-nav {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .page-number {
                color: var(--muted);
                font: 11px "JetBrains Mono";
            }
            .examples-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
                margin: 18px 0 38px;
            }
            .example-card {
                padding: 20px;
                border: 1px solid rgba(41, 121, 255, 0.25);
                border-radius: 12px;
                background: linear-gradient(
                    145deg,
                    rgba(41, 121, 255, 0.08),
                    var(--bg2)
                );
            }
            .example-card span {
                display: block;
                margin-bottom: 8px;
                color: var(--blue);
                font: 700 10px "JetBrains Mono";
                letter-spacing: 0.1em;
            }
            .example-card h4 {
                margin: 0 0 9px;
                font-size: 15px;
            }
            .example-card p {
                margin: 0;
                color: var(--text-muted);
                font-size: 13px;
                line-height: 1.65;
            }
            .example-card code {
                display: block;
                margin-top: 12px;
                padding: 10px;
                border-radius: 6px;
                background: #050709;
                color: var(--green);
                font: 11px "JetBrains Mono";
                overflow: auto;
            }
            .quiz-shell {
                max-width: 780px;
                margin: 0 auto;
            }
            .quiz-header {
                padding: 26px;
                border: 1px solid rgba(255, 234, 0, 0.24);
                border-radius: 14px;
                background: linear-gradient(
                    145deg,
                    rgba(255, 190, 0, 0.08),
                    var(--bg2)
                );
                margin-bottom: 18px;
            }
            .quiz-header h2 {
                margin: 7px 0;
                font-size: 26px;
            }
            .quiz-header p {
                color: var(--text-muted);
                line-height: 1.6;
            }
            .quiz-result {
                padding: 14px 17px;
                margin-bottom: 14px;
                border-radius: 9px;
                border: 1px solid;
            }
            .quiz-result:empty {
                display: none;
            }
            .quiz-result.pass {
                color: var(--green);
                border-color: rgba(0, 230, 118, 0.4);
                background: rgba(0, 230, 118, 0.08);
            }
            .quiz-result.fail {
                color: #ff8c98;
                border-color: rgba(255, 23, 68, 0.38);
                background: rgba(255, 23, 68, 0.08);
            }
            .quiz-question {
                margin: 14px 0;
                padding: 20px;
                border: 1px solid var(--border);
                border-radius: 11px;
                background: var(--bg2);
            }
            .quiz-question h3 {
                margin: 0 0 14px;
                font-size: 15px;
            }
            .quiz-option {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                margin-top: 8px;
                padding: 11px;
                border: 1px solid #28313d;
                border-radius: 7px;
                color: #cfd6dd;
                cursor: pointer;
            }
            .quiz-option:hover {
                border-color: var(--blue);
                background: rgba(41, 121, 255, 0.05);
            }
            .quiz-option input {
                margin-top: 2px;
                accent-color: var(--green);
            }
            .quiz-submit {
                width: 100%;
                margin-top: 14px;
                padding: 13px;
                border: 0;
                border-radius: 8px;
                background: var(--yellow);
                color: #141000;
                font-weight: 800;
                cursor: pointer;
            }
            .quiz-submit:hover {
                filter: brightness(1.1);
                box-shadow: 0 0 20px rgba(255, 211, 0, 0.3);
            }
            .quiz-submit:disabled {
                cursor: wait;
                opacity: 0.65;
                filter: none;
                box-shadow: none;
            }
            @media (max-width: 700px) {
                .examples-grid {
                    grid-template-columns: 1fr;
                }
                .lesson-page-nav {
                    grid-template-columns: 1fr;
                }
                .reader-footer {
                    align-items: flex-start;
                    gap: 14px;
                    flex-direction: column;
                }
            }

            /* ─── PRINT ─── */
            @media print {
                .topbar,
                .sidebar,
                .reader-nav,
                .reader-footer {
                    display: none !important;
                }
                .main {
                    padding: 0 !important;
                    background: #fff !important;
                }
                body {
                    background: #fff;
                    color: #000;
                    height: auto;
                    overflow: visible;
                }
                .reader-section h3 {
                    color: #000;
                }
                .command-block {
                    background: #f5f5f5;
                    border-color: #ddd;
                    box-shadow: none;
                }
                .command-header {
                    background: #eee;
                    border-color: #ddd;
                }
                .command-header code {
                    color: #000;
                    text-shadow: none;
                }
                .command-desc {
                    background: #fafafa;
                    color: #333;
                    border-color: #ccc;
                }
                .outcomes-list li {
                    background: #fff;
                    border-color: #eee;
                    color: #333;
                }
            }

            .mobile-menu-btn {
                display: none;
                background: none;
                border: none;
                color: var(--text);
                font-size: 24px;
                cursor: pointer;
            }
            @media (max-width: 900px) {
                .mobile-menu-btn {
                    display: block;
                }
                .sidebar {
                    position: fixed;
                    left: 0;
                    z-index: 90;
                    transform: translateX(-100%);
                }
                .sidebar.open-mobile {
                    transform: translateX(0);
                }
                .main {
                    padding: 24px;
                }
                .hero {
                    padding: 32px 24px;
                }
                .hero h1 {
                    font-size: 28px;
                }
                .courses-grid {
                    grid-template-columns: 1fr;
                }
                .lesson-visual-panel,
                .visual-flow,
                .visual-focus {
                    grid-template-columns: 1fr;
                }
                .lesson-visual-panel img {
                    min-height: 180px;
                }
                .teaching-rubric {
                    grid-template-columns: 1fr;
                }
                .topbar-stats {
                    display: none;
                } /* Hide stats on very small screens to fit buttons */
                .topbar {
                    padding: 0 16px;
                    gap: 12px;
                }
            }

            /* ═══════════════════════════════════════════════
               HACKER TRAINING PLATFORM — PREMIUM OVERHAUL
               ═══════════════════════════════════════════════ */

            /* ─── SCAN-LINE ANIMATION ─── */
            @keyframes scanLine {
                0% { top: -4px; }
                100% { top: 100%; }
            }
            @keyframes glitchFlicker {
                0%, 100% { opacity: 1; transform: translate(0); }
                20% { opacity: 0.8; transform: translate(-2px, 1px); }
                40% { opacity: 1; transform: translate(1px, -1px); }
                60% { opacity: 0.9; transform: translate(-1px, 0); }
            }
            @keyframes cyberPulse {
                0%, 100% { box-shadow: 0 0 5px rgba(0, 230, 118, 0.2); }
                50% { box-shadow: 0 0 20px rgba(0, 230, 118, 0.5), 0 0 40px rgba(0, 230, 118, 0.1); }
            }
            @keyframes neonFlicker {
                0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 7px var(--green), 0 0 20px var(--green-dim); opacity: 1; }
                20%, 24%, 55% { text-shadow: none; opacity: 0.8; }
            }
            @keyframes threatPulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.15); }
                100% { transform: scale(1); }
            }
            @keyframes typingCursor {
                0%, 100% { border-color: var(--green); }
                50% { border-color: transparent; }
            }
            @keyframes borderGlow {
                0%, 100% { border-color: rgba(255, 23, 68, 0.3); }
                50% { border-color: rgba(255, 23, 68, 0.8); }
            }
            @keyframes accessGranted {
                0% { opacity: 0; transform: scale(0.8); }
                50% { opacity: 1; transform: scale(1.05); }
                100% { opacity: 1; transform: scale(1); }
            }
            @keyframes progressGlow {
                0%, 100% { box-shadow: 0 0 8px var(--green-dim); }
                50% { box-shadow: 0 0 18px var(--green-glow), 0 0 30px var(--green-dim); }
            }
            @keyframes dataStream {
                0% { background-position: 0 0; }
                100% { background-position: 0 -200px; }
            }
            @keyframes slideInUp {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes terminalType {
                from { width: 0; }
                to { width: 100%; }
            }
            @keyframes hexRotate {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            @keyframes riskPulse {
                0%, 100% { opacity: 0.7; }
                50% { opacity: 1; }
            }
            @keyframes logScroll {
                0% { transform: translateY(0); }
                100% { transform: translateY(-50%); }
            }

            /* ─── HERO SECTION OVERHAUL ─── */
            .hero {
                background:
                    linear-gradient(135deg, rgba(0, 10, 2, 0.95), rgba(10, 15, 20, 0.9)),
                    repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(0, 230, 118, 0.03) 50px, rgba(0, 230, 118, 0.03) 51px),
                    repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0, 230, 118, 0.03) 50px, rgba(0, 230, 118, 0.03) 51px);
                border-color: rgba(0, 230, 118, 0.15);
                position: relative;
                overflow: hidden;
            }
            .hero::before {
                content: "";
                position: absolute;
                top: -50%;
                right: -10%;
                width: 600px;
                height: 600px;
                background: radial-gradient(circle, rgba(0, 230, 118, 0.08) 0%, transparent 60%);
                pointer-events: none;
                animation: cyberPulse 4s ease-in-out infinite;
            }
            .hero::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 2px;
                background: linear-gradient(90deg, transparent, var(--green), var(--cyan), var(--green), transparent);
                opacity: 0.6;
                animation: progressGlow 3s ease-in-out infinite;
            }
            .hero-eyebrow {
                animation: neonFlicker 4s ease-in-out infinite;
                position: relative;
                padding-left: 20px;
            }
            .hero-eyebrow::before {
                content: "▶";
                position: absolute;
                left: 0;
                animation: threatPulse 1.5s ease-in-out infinite;
            }
            .hero h1 {
                text-shadow: 0 0 30px rgba(0, 230, 118, 0.15);
            }

            /* Hacker Rank Badge */
            .hacker-rank {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 6px 14px;
                border-radius: 20px;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 1.5px;
                text-transform: uppercase;
                font-family: "JetBrains Mono", monospace;
                margin-top: 16px;
            }
            .hacker-rank.script-kiddie { background: rgba(155, 155, 155, 0.15); border: 1px solid rgba(155, 155, 155, 0.3); color: #aaa; }
            .hacker-rank.analyst { background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3); color: var(--cyan); }
            .hacker-rank.pentester { background: rgba(0, 230, 118, 0.1); border: 1px solid rgba(0, 230, 118, 0.3); color: var(--green); }
            .hacker-rank.elite { background: rgba(213, 0, 249, 0.1); border: 1px solid rgba(213, 0, 249, 0.3); color: var(--purple); }
            .hacker-rank.founder-rank { background: rgba(255, 23, 68, 0.1); border: 1px solid rgba(255, 23, 68, 0.3); color: var(--red); }
            .hacker-rank::before {
                content: "⬡";
                font-size: 14px;
                animation: hexRotate 8s linear infinite;
                display: inline-block;
            }

            /* Threat Counter */
            .hero-threat-counter {
                display: flex;
                gap: 20px;
                margin-top: 20px;
                padding: 14px 20px;
                background: rgba(0, 0, 0, 0.4);
                border: 1px solid rgba(0, 230, 118, 0.12);
                border-radius: 10px;
                width: max-content;
                max-width: 100%;
            }
            .threat-stat {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
            .threat-stat .threat-val {
                font: 700 22px "JetBrains Mono", monospace;
                color: var(--green);
                text-shadow: 0 0 10px var(--green-dim);
            }
            .threat-stat .threat-val.warn { color: var(--yellow); text-shadow: 0 0 10px rgba(255, 234, 0, 0.3); }
            .threat-stat .threat-val.danger { color: var(--red); text-shadow: 0 0 10px rgba(255, 23, 68, 0.3); }
            .threat-stat small {
                font-size: 9px;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            /* Hero Progress Upgrade */
            .hero-progress-bar i {
                animation: progressGlow 2s ease-in-out infinite;
            }

            /* ─── COURSE CARDS OVERHAUL ─── */
            .course-card {
                background: linear-gradient(165deg, #111418, #0a0d10);
                border: 1px solid rgba(0, 230, 118, 0.08);
                transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
                overflow: hidden;
            }
            .course-card::before {
                content: "";
                position: absolute;
                top: -4px;
                left: 0;
                right: 0;
                height: 4px;
                background: linear-gradient(90deg, transparent 30%, var(--green) 50%, transparent 70%);
                opacity: 0;
                z-index: 5;
                animation: scanLine 3s linear infinite;
                transition: opacity 0.3s;
            }
            .course-card:hover::before {
                opacity: 0.6;
            }
            .course-card:hover {
                border-color: rgba(0, 230, 118, 0.3);
                transform: translateY(-6px) scale(1.01);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 230, 118, 0.08);
            }
            .course-card:hover h3 {
                animation: glitchFlicker 0.3s ease;
            }

            /* Difficulty Badge */
            .difficulty-badge {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 3px 8px;
                border-radius: 4px;
                font-size: 9px;
                font-weight: 800;
                letter-spacing: 1px;
                text-transform: uppercase;
                font-family: "JetBrains Mono", monospace;
            }
            .difficulty-badge.beginner { background: rgba(0, 230, 118, 0.12); color: var(--green); border: 1px solid rgba(0, 230, 118, 0.25); }
            .difficulty-badge.intermediate { background: rgba(255, 234, 0, 0.1); color: var(--yellow); border: 1px solid rgba(255, 234, 0, 0.25); }
            .difficulty-badge.advanced { background: rgba(255, 23, 68, 0.1); color: var(--red); border: 1px solid rgba(255, 23, 68, 0.25); }

            /* Tool Tags */
            .tool-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin: 8px 0 12px;
            }
            .tool-tag {
                padding: 2px 7px;
                border-radius: 3px;
                font-size: 9px;
                font-family: "JetBrains Mono", monospace;
                background: rgba(0, 229, 255, 0.08);
                color: var(--cyan);
                border: 1px solid rgba(0, 229, 255, 0.15);
                letter-spacing: 0.5px;
            }

            /* Progress Ring */
            .progress-ring {
                width: 44px;
                height: 44px;
                position: relative;
                flex-shrink: 0;
            }
            .progress-ring svg {
                transform: rotate(-90deg);
                width: 44px;
                height: 44px;
            }
            .progress-ring .ring-bg { stroke: var(--bg4); fill: none; stroke-width: 3; }
            .progress-ring .ring-fill { stroke: var(--green); fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
            .progress-ring .ring-text {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font: 700 10px "JetBrains Mono", monospace;
                color: var(--green);
            }

            /* Threat Level Bar */
            .threat-level-bar {
                height: 3px;
                border-radius: 2px;
                background: var(--bg4);
                margin-top: 12px;
                overflow: hidden;
                position: relative;
            }
            .threat-level-bar i {
                display: block;
                height: 100%;
                border-radius: 2px;
                transition: width 0.4s ease;
            }
            .threat-level-bar.low i { background: var(--green); width: 33%; }
            .threat-level-bar.medium i { background: var(--yellow); width: 66%; }
            .threat-level-bar.high i { background: var(--red); width: 100%; }

            /* Card Footer Upgrade */
            .course-card-footer {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 16px;
            }
            .progress-mini {
                flex: 1;
                height: 4px;
                background: var(--bg4);
                border-radius: 2px;
                overflow: hidden;
            }
            .progress-mini i {
                display: block;
                height: 100%;
                background: linear-gradient(90deg, var(--green), var(--cyan));
                border-radius: 2px;
                transition: width 0.6s ease;
                box-shadow: 0 0 8px var(--green-dim);
            }
            .course-card-footer span {
                font-size: 11px;
                color: var(--text-muted);
                font-family: "JetBrains Mono", monospace;
                white-space: nowrap;
            }

            /* Course Button Upgrade */
            .course-btn {
                background: linear-gradient(135deg, var(--green), #00c06b);
                position: relative;
                overflow: hidden;
            }
            .course-btn::after {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
                transition: left 0.5s;
            }
            .course-btn:hover::after {
                left: 100%;
            }

            /* ─── SIDEBAR ENHANCEMENTS ─── */
            .sidebar-module-header .dot {
                animation: cyberPulse 2s ease-in-out infinite;
            }
            .sidebar-module.open .sidebar-module-header .dot {
                animation: threatPulse 1s ease-in-out infinite;
            }
            .sidebar-lesson .mini-bar {
                width: 40px;
                height: 3px;
                border-radius: 2px;
                background: var(--bg4);
                overflow: hidden;
                margin-left: auto;
            }
            .sidebar-lesson .mini-bar i {
                display: block;
                height: 100%;
                background: var(--green);
                border-radius: 2px;
            }
            .sidebar-lesson.completed::after {
                content: "HACKED";
                position: absolute;
                right: 8px;
                top: 50%;
                transform: translateY(-50%);
                font: 700 7px "JetBrains Mono", monospace;
                color: var(--green);
                opacity: 0.4;
                letter-spacing: 1px;
            }

            /* Terminal Status Bar */
            .sidebar-terminal-bar {
                padding: 10px 16px;
                background: #000;
                border-top: 1px solid rgba(0, 230, 118, 0.15);
                font: 11px "JetBrains Mono", monospace;
                color: var(--green);
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: auto;
                opacity: 0.8;
            }
