            // ─── Notepad ────────────────────────────────────────────
            const CYBERLAB_NOTES_V2_KEY = 'cyberlab_notes_v2';
            const CYBERLAB_NOTES_LEGACY_KEY = 'cyberlab_notes';
            const notepadState = {
                notes: [],
                activeId: null,
                query: '',
                preview: false
            };

            function notepadId() {
                return 'note_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
            }

            function notepadEscape(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function notepadNowLabel(value) {
                if (!value) return 'kaydedilmedi';
                return new Date(value).toLocaleString('tr-TR', {
                    day: '2-digit',
                    month: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            function getCurrentLessonContext() {
                const title = document.querySelector('.reader-header h2')?.textContent?.trim() || 'Genel Akademi Notu';
                const breadcrumb = document.querySelector('.reader-header .breadcrumb')?.textContent?.trim() || '';
                const activeLesson = document.querySelector('.lesson-item.active, .lesson.active, [data-active="true"]');
                return {
                    title,
                    course: breadcrumb.replace(/\s+/g, ' ').trim(),
                    marker: activeLesson?.textContent?.replace(/\s+/g, ' ').trim() || ''
                };
            }

            function normalizeNote(note) {
                const now = new Date().toISOString();
                return {
                    id: note.id || notepadId(),
                    title: note.title || 'Yeni not',
                    body: note.body || '',
                    tags: Array.isArray(note.tags) ? note.tags : String(note.tags || '').split(',').map(t => t.trim()).filter(Boolean),
                    pinned: Boolean(note.pinned),
                    createdAt: note.createdAt || now,
                    updatedAt: note.updatedAt || now,
                    lessonTitle: note.lessonTitle || '',
                    courseTitle: note.courseTitle || ''
                };
            }

            function loadNotepadState() {
                try {
                    const raw = JSON.parse(localStorage.getItem(CYBERLAB_NOTES_V2_KEY) || 'null');
                    notepadState.notes = Array.isArray(raw?.notes) ? raw.notes.map(normalizeNote) : [];
                    notepadState.activeId = raw?.activeId || notepadState.notes[0]?.id || null;
                } catch (_) {
                    notepadState.notes = [];
                    notepadState.activeId = null;
                }

                const legacy = localStorage.getItem(CYBERLAB_NOTES_LEGACY_KEY);
                if (legacy && !notepadState.notes.length) {
                    const ctx = getCurrentLessonContext();
                    const note = normalizeNote({
                        title: 'Aktarılan eski not',
                        body: legacy,
                        tags: ['aktarim'],
                        lessonTitle: ctx.title,
                        courseTitle: ctx.course
                    });
                    notepadState.notes = [note];
                    notepadState.activeId = note.id;
                    localStorage.removeItem(CYBERLAB_NOTES_LEGACY_KEY);
                    saveNotepadState();
                }

                if (!notepadState.notes.length) createNote(false);
            }

            function saveNotepadState() {
                localStorage.setItem(CYBERLAB_NOTES_V2_KEY, JSON.stringify({
                    notes: notepadState.notes,
                    activeId: notepadState.activeId
                }));
            }

            function getActiveNote() {
                return notepadState.notes.find(note => note.id === notepadState.activeId) || notepadState.notes[0] || null;
            }

            function sortedFilteredNotes() {
                const q = notepadState.query.trim().toLowerCase();
                return notepadState.notes
                    .filter(note => {
                        if (!q) return true;
                        return [note.title, note.body, note.lessonTitle, note.courseTitle, note.tags.join(' ')]
                            .join(' ')
                            .toLowerCase()
                            .includes(q);
                    })
                    .sort((a, b) => Number(b.pinned) - Number(a.pinned) || new Date(b.updatedAt) - new Date(a.updatedAt));
            }

            function renderNotepadList(active) {
                const list = document.getElementById('notepad-list');
                const total = document.getElementById('notepad-total');
                if (total) total.textContent = `${notepadState.notes.length} not`;
                if (!list) return;
                const notes = sortedFilteredNotes();
                list.innerHTML = notes.length ? notes.map(note => `
                    <button class="notepad-note ${note.id === active?.id ? 'active' : ''}" onclick="selectNote('${note.id}')">
                        <strong>${note.pinned ? '★ ' : ''}${notepadEscape(note.title)}</strong>
                        <span>${notepadEscape(note.lessonTitle || note.tags.join(', ') || 'Genel not')}</span>
                        <span>${notepadNowLabel(note.updatedAt)}</span>
                    </button>
                `).join('') : '<div style="color:#6f8396;font-size:12px;padding:10px;">Eşleşen not yok.</div>';
            }

            function renderNotepad() {
                const active = getActiveNote();
                const title = document.getElementById('notepad-title-input');
                const tags = document.getElementById('notepad-tags-input');
                const body = document.getElementById('notepad-textarea');
                const context = document.getElementById('notepad-context');
                const workspace = document.getElementById('notepad-workspace');
                const preview = document.getElementById('notepad-preview');
                const pinBtn = document.getElementById('notepad-pin-btn');

                renderNotepadList(active);

                if (title) title.value = active?.title || '';
                if (tags) tags.value = active?.tags?.join(', ') || '';
                if (body) body.value = active?.body || '';
                if (context) {
                    const linked = active?.lessonTitle ? `${active.courseTitle ? active.courseTitle + ' · ' : ''}${active.lessonTitle}` : 'Derse bağlı değil';
                    context.textContent = linked;
                }
                if (pinBtn) pinBtn.textContent = active?.pinned ? 'Pinned' : 'Pin';
                if (workspace) workspace.classList.toggle('previewing', notepadState.preview);
                if (preview) {
                    preview.classList.toggle('show', notepadState.preview);
                    preview.innerHTML = renderNotepadMarkdown(active?.body || '');
                }
                updateNotepadChars();
            }

            function createNote(render = true) {
                const ctx = getCurrentLessonContext();
                const note = normalizeNote({
                    title: ctx.title === 'Genel Akademi Notu' ? 'Yeni not' : ctx.title,
                    body: '',
                    tags: [],
                    lessonTitle: ctx.title === 'Genel Akademi Notu' ? '' : ctx.title,
                    courseTitle: ctx.course
                });
                notepadState.notes.unshift(note);
                notepadState.activeId = note.id;
                saveNotepadState();
                if (render) renderNotepad();
                setTimeout(() => document.getElementById('notepad-title-input')?.focus(), 0);
            }

            function selectNote(id) {
                notepadState.activeId = id;
                saveNotepadState();
                renderNotepad();
                document.getElementById('notepad-textarea')?.focus();
            }

            function setNotepadSearch(value) {
                notepadState.query = value || '';
                renderNotepad();
            }

            function saveActiveNoteFromInputs() {
                const note = getActiveNote();
                if (!note) return;
                note.title = document.getElementById('notepad-title-input')?.value.trim() || 'Başlıksız not';
                note.tags = (document.getElementById('notepad-tags-input')?.value || '')
                    .split(',')
                    .map(tag => tag.trim())
                    .filter(Boolean);
                note.body = document.getElementById('notepad-textarea')?.value || '';
                note.updatedAt = new Date().toISOString();
                saveNotepadState();
                renderNotepadList(note);
                const preview = document.getElementById('notepad-preview');
                if (preview) preview.innerHTML = renderNotepadMarkdown(note.body || '');
                updateNotepadChars();
            }

            function toggleNotepad() {
                const panel = document.getElementById('notepad-panel');
                const shortcutsP = document.getElementById('shortcuts-panel');
                if (!panel) return;
                const isOpen = panel.style.display === 'flex';
                panel.style.display = isOpen ? 'none' : 'flex';
                panel.style.flexDirection = 'column';
                if (shortcutsP) shortcutsP.style.display = 'none';
                if (!isOpen) {
                    loadNotepadState();
                    renderNotepad();
                    document.getElementById('notepad-textarea')?.focus();
                }
            }

            function bindNoteToLesson() {
                const note = getActiveNote();
                if (!note) return;
                const ctx = getCurrentLessonContext();
                note.lessonTitle = ctx.title === 'Genel Akademi Notu' ? '' : ctx.title;
                note.courseTitle = ctx.course;
                note.updatedAt = new Date().toISOString();
                saveNotepadState();
                renderNotepad();
            }

            function toggleActiveNotePin() {
                const note = getActiveNote();
                if (!note) return;
                note.pinned = !note.pinned;
                note.updatedAt = new Date().toISOString();
                saveNotepadState();
                renderNotepad();
            }

            function deleteActiveNote() {
                const note = getActiveNote();
                if (!note || !confirm('Bu not silinecek. Emin misin?')) return;
                notepadState.notes = notepadState.notes.filter(item => item.id !== note.id);
                notepadState.activeId = notepadState.notes[0]?.id || null;
                if (!notepadState.notes.length) createNote(false);
                saveNotepadState();
                renderNotepad();
            }

            function clearNotes() {
                if (!confirm('Tüm notlar kalıcı olarak silinecek. Emin misin?')) return;
                localStorage.removeItem(CYBERLAB_NOTES_V2_KEY);
                localStorage.removeItem(CYBERLAB_NOTES_LEGACY_KEY);
                notepadState.notes = [];
                notepadState.activeId = null;
                createNote(false);
                saveNotepadState();
                renderNotepad();
            }

            function downloadNotes() {
                const note = getActiveNote();
                if (!note || !note.body.trim()) return;
                const content = `# ${note.title}\n\n${note.lessonTitle ? `Ders: ${note.lessonTitle}\n` : ''}${note.tags.length ? `Etiketler: ${note.tags.join(', ')}\n` : ''}Güncelleme: ${notepadNowLabel(note.updatedAt)}\n\n${note.body}`;
                const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'cyberlab_not_' + (note.title || 'not').toLowerCase().replace(/[^a-z0-9ğüşöçıİĞÜŞÖÇ]+/gi, '-').slice(0, 40) + '.md';
                a.click();
                URL.revokeObjectURL(url);
            }

            function exportNotesJson() {
                const blob = new Blob([JSON.stringify(notepadState.notes, null, 2)], { type: 'application/json;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'cyberlab_not_defteri_' + new Date().toISOString().slice(0,10) + '.json';
                a.click();
                URL.revokeObjectURL(url);
            }

            async function copyActiveNote() {
                const note = getActiveNote();
                if (!note) return;
                await navigator.clipboard?.writeText(note.body || '');
            }

            function toggleNotepadPreview() {
                notepadState.preview = !notepadState.preview;
                const btn = document.getElementById('notepad-preview-btn');
                if (btn) btn.textContent = notepadState.preview ? 'Düzenle' : 'Önizle';
                renderNotepad();
            }

            function renderNotepadMarkdown(text) {
                const escaped = notepadEscape(text);
                return escaped
                    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
                    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
                    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
                    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/^- (.*)$/gm, '<div>• $1</div>')
                    .replace(/\n/g, '<br>');
            }

            function insertNotepadTemplate() {
                const note = getActiveNote();
                if (!note) return;
                const stamp = new Date().toLocaleString('tr-TR');
                const template = `\n\n## Çalışma Kaydı - ${stamp}\n\n### 1. Kanıt Kutusu\n- Hedef/Kapsam:\n- Normal Akış:\n- Denenen Adım:\n- Ham Kanıt:\n\`\`\`\n\n\`\`\`\n- Gözlenen Fark:\n\n### 2. Analiz Kutusu\n- Yorum/Risk:\n- Kök Neden:\n- Düzeltme:\n- Retest Beklentisi:\n`;
                const ta = document.getElementById('notepad-textarea');
                if (!ta) return;
                const start = ta.selectionStart || ta.value.length;
                ta.value = ta.value.slice(0, start) + template + ta.value.slice(start);
                ta.focus();
                ta.selectionStart = ta.selectionEnd = start + template.length;
                saveActiveNoteFromInputs();
            }

            function updateNotepadChars() {
                const note = getActiveNote();
                const label = document.getElementById('notepad-chars');
                if (!label) return;
                const body = note?.body || '';
                const words = body.trim() ? body.trim().split(/\s+/).length : 0;
                label.textContent = `${body.length} karakter · ${words} kelime · ${notepadNowLabel(note?.updatedAt)}`;
            }

            // Auto-save notepad
            document.addEventListener('DOMContentLoaded', () => {
                loadNotepadState();
                renderNotepad();
            });

            // ─── Shortcuts Panel ─────────────────────────────────────
            function toggleShortcutsPanel() {
                const panel = document.getElementById('shortcuts-panel');
                const notepadP = document.getElementById('notepad-panel');
                if (!panel) return;
                const isOpen = panel.style.display === 'block';
                panel.style.display = isOpen ? 'none' : 'block';
                if (notepadP) notepadP.style.display = 'none';
            }

            // ─── Global Progress Bar (sidebar) ────────────────────────
            function updateGlobalProgressBar() {
                try {
                    const courses = window.ACADEMY_COURSES || [];
                    let total = 0, done = 0;
                    const prog = accountProgress || {};
                    courses.forEach(c => {
                        (c.lessons || []).forEach(l => {
                            total++;
                            if (prog[pKey(c.id, l.id)]) done++;
                        });
                    });
                    const bar = document.getElementById('sidebar-global-progress-bar');
                    const label = document.getElementById('sidebar-progress-label');
                    if (bar) bar.style.width = (total > 0 ? (done/total*100).toFixed(0) : 0) + '%';
                    if (label) label.textContent = done + ' / ' + total + ' ders';
                } catch (_) {}
            }

            // ─── Keyboard Shortcuts ──────────────────────────────────
            document.addEventListener('keydown', (e) => {
                const tag = document.activeElement?.tagName;
                const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
                const notepadOpen = document.getElementById('notepad-panel')?.style.display === 'flex';

                if (notepadOpen && (e.metaKey || e.ctrlKey) && e.key === 's') {
                    e.preventDefault();
                    saveActiveNoteFromInputs();
                    return;
                }
                if (notepadOpen && (e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                    e.preventDefault();
                    insertNotepadTemplate();
                    return;
                }

                if (e.key === 'Escape') {
                    document.getElementById('notepad-panel').style.display = 'none';
                    document.getElementById('shortcuts-panel').style.display = 'none';
                    closeLessonSearch();
                    return;
                }
                if (inInput) return;

                // Ok tuşlarıyla ders navigasyonu
                if (currentView === 'lesson') {
                    if (e.key === 'ArrowRight' && currentLessonPage < 5) {
                        e.preventDefault();
                        showLesson(currentCourseId, currentLessonIndex, currentLessonPage + 1);
                        return;
                    }
                    if (e.key === 'ArrowLeft' && currentLessonPage > 1) {
                        e.preventDefault();
                        showLesson(currentCourseId, currentLessonIndex, currentLessonPage - 1);
                        return;
                    }
                }

                if (e.key === 'n' || e.key === 'N') {
                    e.preventDefault();
                    toggleNotepad();
                }
                if (e.key === '?') {
                    e.preventDefault();
                    toggleShortcutsPanel();
                }
                if (e.key === 's' || e.key === 'S') {
                    e.preventDefault();
                    const si = document.getElementById('search-input');
                    if (si) si.focus();
                }
                // Ctrl+F → ders içi arama
                if ((e.ctrlKey || e.metaKey) && e.key === 'f' && currentView === 'lesson') {
                    e.preventDefault();
                    toggleLessonSearch();
                }
            });

            // ─── Ders İçi Arama (Ctrl+F) ───
            const lessonSearchBar = document.createElement('div');
            lessonSearchBar.id = 'lesson-search-bar';
            lessonSearchBar.style.cssText = `
                display:none; position:fixed; top:56px; right:20px; z-index:5000;
                background:#151b25; border:1px solid var(--green); border-radius:10px;
                padding:8px 12px; display:none; align-items:center; gap:8px;
                box-shadow:0 4px 24px rgba(0,230,118,0.15);
                font-family:'JetBrains Mono',monospace;
            `;
            lessonSearchBar.innerHTML = `
                <input id="lesson-search-input" placeholder="Metinde ara..." style="
                    background:transparent;border:none;outline:none;color:#fff;
                    font-family:'JetBrains Mono',monospace;font-size:13px;width:200px;
                ">
                <span id="lesson-search-count" style="font-size:11px;color:#6b7a90;"></span>
                <button onclick="lessonSearchNav(-1)" style="background:transparent;border:none;color:#6b7a90;cursor:pointer;font-size:14px;">&#8593;</button>
                <button onclick="lessonSearchNav(1)" style="background:transparent;border:none;color:#6b7a90;cursor:pointer;font-size:14px;">&#8595;</button>
                <button onclick="closeLessonSearch()" style="background:transparent;border:none;color:#6b7a90;cursor:pointer;font-size:16px;">×</button>
            `;
            document.body.appendChild(lessonSearchBar);

            let _lsMatches = [], _lsCur = -1;
            document.getElementById('lesson-search-input').addEventListener('input', (e) => {
                lessonSearchExec(e.target.value);
            });

            function toggleLessonSearch() {
                const bar = document.getElementById('lesson-search-bar');
                if (bar.style.display === 'flex') { closeLessonSearch(); return; }
                bar.style.display = 'flex';
                document.getElementById('lesson-search-input').focus();
            }
            function closeLessonSearch() {
                document.getElementById('lesson-search-bar').style.display = 'none';
                document.getElementById('lesson-search-input').value = '';
                // Vurgulamaları temizle
                document.querySelectorAll('.ls-highlight').forEach(el => {
                    el.replaceWith(document.createTextNode(el.textContent));
                });
                _lsMatches = []; _lsCur = -1;
                document.getElementById('lesson-search-count').textContent = '';
            }
            function lessonSearchExec(q) {
                // Önce temizle
                document.querySelectorAll('.ls-highlight').forEach(el => el.replaceWith(document.createTextNode(el.textContent)));
                _lsMatches = []; _lsCur = -1;
                if (!q || q.length < 2) { document.getElementById('lesson-search-count').textContent = ''; return; }
                const main = document.getElementById('main-content');
                if (!main) return;
                const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT);
                const nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                nodes.forEach(node => {
                    if (!node.textContent.match(re)) return;
                    const parent = node.parentElement;
                    if (['SCRIPT','STYLE','INPUT','TEXTAREA'].includes(parent?.tagName)) return;
                    const frag = document.createDocumentFragment();
                    let last = 0;
                    node.textContent.replace(re, (match, offset) => {
                        frag.appendChild(document.createTextNode(node.textContent.slice(last, offset)));
                        const mark = document.createElement('mark');
                        mark.className = 'ls-highlight';
                        mark.style.cssText = 'background:rgba(255,234,0,0.4);color:#fff;border-radius:2px;padding:0 1px;';
                        mark.textContent = match;
                        frag.appendChild(mark);
                        _lsMatches.push(mark);
                        last = offset + match.length;
                    });
                    frag.appendChild(document.createTextNode(node.textContent.slice(last)));
                    node.replaceWith(frag);
                });
                const cnt = document.getElementById('lesson-search-count');
                cnt.textContent = _lsMatches.length ? `1/${_lsMatches.length}` : 'yok';
                if (_lsMatches.length) { _lsCur = 0; lessonSearchScrollTo(0); }
            }
            function lessonSearchNav(dir) {
                if (!_lsMatches.length) return;
                _lsCur = (_lsCur + dir + _lsMatches.length) % _lsMatches.length;
                lessonSearchScrollTo(_lsCur);
                document.getElementById('lesson-search-count').textContent = `${_lsCur+1}/${_lsMatches.length}`;
            }
            function lessonSearchScrollTo(idx) {
                _lsMatches.forEach((m, i) => m.style.background = i === idx ? 'rgba(0,230,118,0.5)' : 'rgba(255,234,0,0.4)');
                _lsMatches[idx]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            initAcademy();
            initSessionTerminal();
            animateThreatCounters();
        </script>
    </body>
</html>
